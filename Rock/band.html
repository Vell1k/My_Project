<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Группа - ROCK</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="band-page">
    <header class="band-header">
        <div class="container">
            <a href="index.html" class="back-link">← Назад к группам</a>
        </div>
    </header>

    <main class="band-content">
        <div class="band-hero" id="bandHero">
            <div class="band-hero-content">
                <h1 id="bandName"></h1>
                <p id="bandGenre"></p>
            </div>
        </div>

        <div class="container">
            <section class="band-info">
                <h2>О группе</h2>
                <p id="bandDescription"></p>
            </section>

            <section class="albums-section">
                <h2>Альбомы</h2>
                <div class="albums-grid" id="albumsGrid"></div>
            </section>

            <section class="songs-section">
                <h2>Популярные песни</h2>
                <div class="songs-list" id="songsList"></div>
            </section>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2025 ROCK. Все права защищены.</p>
        </div>
    </footer>

    <!-- Аудиоплеер -->
    <div class="audio-player" id="audioPlayer">
        <div class="vinyl" id="vinyl">
            <div class="vinyl-center"></div>
        </div>
        <div class="player-info">
            <span class="player-track-name" id="playerTrackName">Выберите песню</span>
        </div>
        <div class="player-controls">
            <button class="player-btn" id="playBtn" title="Воспроизвести"></button>
            <div class="player-progress-container" id="progressContainer">
                <div class="player-progress" id="progressBar"></div>
            </div>
            <span class="player-time" id="playerTime">0:00</span>
            <input type="range" class="player-volume" id="volumeSlider" min="0" max="1" step="0.01" value="0.7">
        </div>
        <audio id="audioElement" preload="metadata"></audio>
    </div>

    <script src="script.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const bandId = urlParams.get('band');
        loadBandPage(bandId);
    </script>
</body>

</html>
